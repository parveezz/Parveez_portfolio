<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Portfolio Message</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Reset & Fonts */
    body, p, h1, h2, h3, a {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      padding: 40px 16px;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      max-width: 600px;
      margin: 0 auto;
      background: linear-gradient(180deg, #131b2e 0%, #0d1322 100%);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6), 0 0 30px rgba(99, 102, 241, 0.15);
    }
    .header {
      padding: 36px 32px 24px;
      background: radial-gradient(circle at top, rgba(99, 102, 241, 0.2) 0%, transparent 70%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.35);
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
    }
    .content {
      padding: 32px;
    }
    .sender-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 24px;
    }
    .meta-row {
      display: flex;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .meta-row:last-child {
      margin-bottom: 0;
    }
    .meta-label {
      width: 80px;
      color: #94a3b8;
      font-weight: 600;
    }
    .meta-value {
      color: #f1f5f9;
      font-weight: 500;
      word-break: break-all;
    }
    .meta-value a {
      color: #818cf8;
      text-decoration: none;
    }
    .meta-value a:hover {
      text-decoration: underline;
    }
    .message-box {
      background: #080c16;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-left: 4px solid #6366f1;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 28px;
    }
    .message-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .message-text {
      font-size: 15px;
      line-height: 1.65;
      color: #e2e8f0;
      white-space: pre-wrap;
    }
    .cta-container {
      text-align: center;
      margin-top: 10px;
    }
    .reply-btn {
      display: inline-block;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff !important;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 28px;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
      transition: opacity 0.2s;
    }
    .reply-btn:hover {
      opacity: 0.9;
    }
    .footer {
      padding: 20px 32px 28px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      text-align: center;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- Header -->
    <div class="header">
      <span class="badge">Portfolio Notification</span>
      <h1 class="title">New Message Received</h1>
    </div>

    <!-- Content -->
    <div class="content">
      <!-- Sender Information -->
      <div class="sender-card">
        <div class="meta-row">
          <div class="meta-label">From:</div>
          <div class="meta-value" id="senderName">{{NAME}}</div>
        </div>
        <div class="meta-row">
          <div class="meta-label">Email:</div>
          <div class="meta-value">
            <a href="mailto:{{EMAIL}}" id="senderEmail">{{EMAIL}}</a>
          </div>
        </div>
        <div class="meta-row">
          <div class="meta-label">Subject:</div>
          <div class="meta-value" id="messageSubject">{{SUBJECT}}</div>
        </div>
      </div>

      <!-- Message Content -->
      <div class="message-box">
        <div class="message-label">Message Content:</div>
        <p class="message-text" id="messageBody">{{MESSAGE}}</p>
      </div>

      <!-- Quick Reply Action -->
      <div class="cta-container">
        <a href="mailto:{{EMAIL}}?subject=Re: {{SUBJECT}}" class="reply-btn" id="replyLink">
          Reply Directly via Email
        </a>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <p>This message was delivered automatically from your Next.js Portfolio backend.</p>
    </div>
  </div>

</body>
</html>
