<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hollyoak's Plucky Sprout Squad — Meadowbell</title>

  <!-- Google Fonts: Grandstander (900) & Inter (400, 500) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* CSS Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --u: calc(100vw / 1440);
      --green-btn: #5b875c;
      --headline-shadow: 0 calc(4 * var(--u)) calc(18 * var(--u)) rgba(28, 70, 120, 0.28);
    }

    body {
      background: #88b7d5;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 1440x1280 Hero Frame Container */
    .hero-frame {
      position: relative;
      width: 100vw;
      height: calc(1280 * var(--u));
      overflow: hidden;
      user-select: none;
    }

    /* Scene: Plate and Loop Video */
    .scene-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    .scene-plate {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Video overlay: 100% width, 112.5% height, top -6.25% */
    .scene-video {
      position: absolute;
      left: 0;
      top: -6.25%;
      width: 100%;
      height: 112.5%;
      object-fit: cover;
      pointer-events: none;
      display: block;
    }

    /* Content Layer */
    .content-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* --- NAVIGATION --- */
    .nav-logo {
      position: absolute;
      left: calc(31 * var(--u));
      top: calc(23 * var(--u));
      display: flex;
      align-items: center;
      gap: calc(7 * var(--u));
      color: #ffffff;
      font-family: 'Grandstander', cursive, sans-serif;
      font-weight: 900;
      font-size: calc(29.5 * var(--u));
      line-height: 1;
      text-decoration: none;
      cursor: pointer;
      z-index: 10;
    }

    .nav-logo svg {
      width: calc(26 * var(--u));
      height: calc(26 * var(--u));
      fill: #ffffff;
    }

    .nav-pill {
      position: absolute;
      left: calc(443 * var(--u));
      top: calc(13 * var(--u));
      width: calc(546 * var(--u));
      height: calc(50 * var(--u));
      border-radius: calc(25 * var(--u));
      background: rgba(173, 196, 174, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 calc(49 * var(--u));
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: calc(19.5 * var(--u));
      color: #ffffff;
      transition: transform 0.25s ease, background 0.25s ease;
      z-index: 10;
    }

    .nav-pill a {
      color: #ffffff;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .nav-pill a:hover {
      opacity: 0.8;
    }

    .nav-pill .dot {
      opacity: 0.8;
      user-select: none;
    }

    .nav-join {
      position: absolute;
      left: calc(1311 * var(--u));
      top: calc(14 * var(--u));
      width: calc(105 * var(--u));
      height: calc(45 * var(--u));
      border-radius: calc(22.5 * var(--u));
      background: #ffffff;
      color: var(--green-btn);
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: calc(18.5 * var(--u));
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 calc(2 * var(--u)) calc(8 * var(--u)) rgba(0, 0, 0, 0.08);
      transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.25s ease;
      z-index: 10;
    }

    /* --- HERO COPY --- */
    .kicker {
      position: absolute;
      top: calc(203 * var(--u));
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Grandstander', cursive, sans-serif;
      font-weight: 900;
      font-size: calc(40.5 * var(--u));
      line-height: 1;
      letter-spacing: calc(0.5 * var(--u));
      color: #ffffff;
      text-align: center;
      white-space: nowrap;
    }

    .headline {
      position: absolute;
      top: calc(261 * var(--u));
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Grandstander', cursive, sans-serif;
      font-weight: 900;
      font-size: calc(143.5 * var(--u));
      line-height: calc(118 * var(--u));
      text-align: center;
      color: #ffffff;
      text-shadow: var(--headline-shadow);
      white-space: nowrap;
    }

    .headline-line {
      display: inline-block;
    }

    .subline {
      position: absolute;
      top: calc(520 * var(--u));
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: calc(21.2 * var(--u));
      line-height: calc(27 * var(--u));
      text-align: center;
      color: #ffffff;
      white-space: pre-line;
      text-shadow: 0 calc(1 * var(--u)) calc(4 * var(--u)) rgba(28, 70, 120, 0.2);
    }

    /* --- BUTTONS --- */
    .btn-join-hero {
      position: absolute;
      left: calc(550 * var(--u));
      top: calc(617 * var(--u));
      width: calc(144 * var(--u));
      height: calc(59 * var(--u));
      border-radius: calc(29.5 * var(--u));
      background: #ffffff;
      color: var(--green-btn);
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: calc(22 * var(--u));
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 calc(4 * var(--u)) calc(12 * var(--u)) rgba(0, 0, 0, 0.1);
      transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.25s ease;
      z-index: 10;
    }

    .btn-preview {
      position: absolute;
      left: calc(707 * var(--u));
      top: calc(619 * var(--u));
      width: calc(184 * var(--u));
      height: calc(58 * var(--u));
      border-radius: calc(29 * var(--u));
      background: rgba(204, 218, 173, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: calc(19.5 * var(--u));
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(9 * var(--u));
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1), background 0.25s ease;
      z-index: 10;
    }

    .btn-preview svg {
      width: calc(14 * var(--u));
      height: calc(14 * var(--u));
      fill: #ffffff;
      flex-shrink: 0;
    }

    /* --- CHAPTERS ROW --- */
    .chapters-title {
      position: absolute;
      left: calc(137 * var(--u));
      top: calc(866 * var(--u));
      font-family: 'Grandstander', cursive, sans-serif;
      font-weight: 900;
      font-size: calc(36 * var(--u));
      line-height: 1;
      color: #ffffff;
      letter-spacing: calc(0.5 * var(--u));
    }

    .chapters-link {
      position: absolute;
      right: calc((1440 - 1308) * var(--u));
      top: calc(876 * var(--u));
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: calc(22 * var(--u));
      line-height: 1;
      color: #ffffff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: calc(4 * var(--u));
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .chapters-link .chevron {
      display: inline-block;
      transition: transform 0.25s ease;
    }

    .chapters-link:hover .chevron {
      transform: translateX(calc(4 * var(--u)));
    }

    /* Chapter Cards */
    .chapter-card {
      position: absolute;
      top: calc(913 * var(--u));
      width: calc(378 * var(--u));
      height: calc(273 * var(--u));
      border-radius: calc(15 * var(--u));
      overflow: hidden;
      box-shadow: 0 calc(8 * var(--u)) calc(24 * var(--u)) rgba(0, 0, 0, 0.12);
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.3s ease;
      z-index: 5;
    }

    .chapter-card-1 { left: calc(133 * var(--u)); }
    .chapter-card-2 { left: calc(531 * var(--u)); }
    .chapter-card-3 { left: calc(929 * var(--u)); }

    .card-media-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: calc(15 * var(--u));
    }

    .card-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1);
    }

    .card-play-btn {
      position: absolute;
      left: calc(20 * var(--u));
      bottom: calc(20 * var(--u));
      width: calc(38 * var(--u));
      height: calc(38 * var(--u));
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 calc(2 * var(--u)) calc(8 * var(--u)) rgba(0, 0, 0, 0.2);
      transition: transform 0.25s ease, background 0.25s ease;
    }

    .card-play-btn svg {
      width: calc(14 * var(--u));
      height: calc(14 * var(--u));
      fill: #2c4a32;
      margin-left: calc(2 * var(--u));
    }

    /* Hover effects */
    .chapter-card:hover {
      transform: translateY(calc(-8 * var(--u)));
      box-shadow: 0 calc(16 * var(--u)) calc(32 * var(--u)) rgba(0, 0, 0, 0.2);
    }

    .chapter-card:hover .card-art {
      transform: scale(1.05);
    }

    .chapter-card:hover .card-play-btn {
      transform: scale(1.1);
      background: #ffffff;
    }

    .nav-pill:hover,
    .nav-join:hover,
    .btn-join-hero:hover,
    .btn-preview:hover {
      transform: translateY(calc(-2 * var(--u)));
    }

    /* --- REDUCED MOTION --- */
    @media (prefers-reduced-motion: reduce) {
      .scene-video {
        display: none !important;
      }
      *, *::before, *::after {
        transition-duration: 0.001ms !important;
        animation-duration: 0.001ms !important;
      }
    }

    /* --- MOBILE / PHONES (<= 820px) --- */
    @media (max-width: 820px) {
      :root {
        --u: 1px;
      }

      .hero-frame {
        width: 100%;
        height: auto;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding-bottom: 32px;
      }

      .scene-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      /* Phone Scene: 9:8 box sized to hero's height shifted so boy and dog stay in view */
      .scene-plate, .scene-video {
        width: auto;
        height: 100%;
        aspect-ratio: 9 / 8;
        left: 18%;
        transform: translateX(-18%);
        top: 0;
      }

      .content-layer {
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* Compact Nav */
      .nav-logo {
        position: relative;
        left: 0;
        top: 0;
        font-size: 24px;
      }

      .nav-logo svg {
        width: 22px;
        height: 22px;
      }

      .nav-pill {
        display: none;
      }

      .nav-join {
        position: relative;
        left: 0;
        top: 0;
        width: 88px;
        height: 38px;
        font-size: 15px;
      }

      .nav-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 24px;
        width: 100%;
      }

      /* Stacked Centered Copy */
      .copy-container {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 24px 20px;
        margin: auto 0;
      }

      .kicker {
        position: relative;
        top: 0;
        left: 0;
        transform: none;
        font-size: 22px;
        margin-bottom: 8px;
      }

      .headline {
        position: relative;
        top: 0;
        left: 0;
        transform: none;
        font-size: 51px;
        line-height: 1.05;
        white-space: normal;
        margin-bottom: 16px;
      }

      .subline {
        position: relative;
        top: 0;
        left: 0;
        transform: none;
        font-size: 15px;
        line-height: 22px;
        white-space: normal;
        margin-bottom: 24px;
        max-width: 320px;
      }

      .buttons-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        max-width: 260px;
      }

      .btn-join-hero {
        position: relative;
        left: 0;
        top: 0;
        width: 100%;
        height: 50px;
        font-size: 18px;
      }

      .btn-preview {
        position: relative;
        left: 0;
        top: 0;
        width: 100%;
        height: 50px;
        font-size: 16px;
      }

      .btn-preview svg {
        width: 14px;
        height: 14px;
      }

      /* Mobile Chapters Section */
      .chapters-section {
        position: relative;
        width: 100%;
        padding-top: 16px;
      }

      .chapters-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px 12px;
      }

      .chapters-title {
        position: relative;
        left: 0;
        top: 0;
        font-size: 24px;
      }

      .chapters-link {
        position: relative;
        right: 0;
        top: 0;
        font-size: 15px;
      }

      .chapters-scroll-track {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        gap: 16px;
        padding: 4px 24px 16px;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .chapters-scroll-track::-webkit-scrollbar {
        display: none;
      }

      .chapter-card {
        position: relative;
        top: 0;
        left: 0;
        flex: 0 0 280px;
        height: 202px;
        scroll-snap-align: start;
        border-radius: 14px;
      }

      .card-play-btn {
        left: 16px;
        bottom: 16px;
        width: 32px;
        height: 32px;
      }

      .card-play-btn svg {
        width: 12px;
        height: 12px;
      }
    }
  </style>
</head>
<body>

  <main class="hero-frame" id="heroFrame">
    <!-- Plate & Looping Animation Layer -->
    <div class="scene-container">
      <img
        class="scene-plate"
        src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3ca5d10d-ea2f-4907-876f-33bde169469e.jpg"
        alt="A sunny grassy hillside with a boy and his beagle looking up at a cumulus sky"
      />
      <video
        class="scene-video"
        autoplay
        loop
        muted
        playsinline
        preload="auto"
      >
        <source src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/d2cb5bef-f92b-4e91-ae93-8dc6555e56ac.mp4" type="video/mp4" />
      </video>
    </div>

    <!-- UI Overlay Layer -->
    <div class="content-layer">
      <!-- Top Navigation -->
      <nav class="nav-header">
        <a href="#" class="nav-logo" id="animLogo" aria-label="Meadowbell Home">
          <svg viewBox="0 0 24 24">
            <!-- Two-leaf Sprout Icon -->
            <path d="M12 3C8 3 4 7 4 12C7 12 11 9 12 3Z"/>
            <path d="M12 7C14 7 20 8.5 20 14C16.5 14 13 11.5 12 7Z"/>
            <path d="M11 12C11 17 11.5 21 12 21" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
          </svg>
          <span>Meadowbell</span>
        </a>

        <div class="nav-pill" id="animNavPill">
          <a href="#farm">Farm</a>
          <span class="dot">·</span>
          <a href="#gear">Gear</a>
          <span class="dot">·</span>
          <a href="#chapters">Chapters</a>
          <span class="dot">·</span>
          <a href="#crew">Our Crew</a>
        </div>

        <a href="#join" class="nav-join" id="animNavJoin">Join us</a>
      </nav>

      <!-- Center Copy Area -->
      <div class="copy-container">
        <p class="kicker" id="animKicker">HOLLYOAK'S</p>
        <h1 class="headline" id="animHeadline">
          <span class="headline-line" id="animHeadline1">PLUCKY</span><br />
          <span class="headline-line" id="animHeadline2">SPROUT SQUAD</span>
        </h1>
        <p class="subline" id="animSubline">Learn the Ways of the Meadow with<br />Hollyoak's Plucky Sprout Squad! Each chapter is<br />packed with play, chores, and wonder.</p>

        <!-- CTAs -->
        <div class="buttons-group">
          <a href="#join" class="btn-join-hero" id="animBtnJoin">Join us</a>
          <a href="#preview" class="btn-preview" id="animBtnPreview">
            <svg viewBox="0 0 24 24">
              <path d="M6 4.75C6 3.97 6.85 3.5 7.5 3.92L19.2 11.17C19.83 11.57 19.83 12.43 19.2 12.83L7.5 20.08C6.85 20.5 6 20.03 6 19.25V4.75Z" />
            </svg>
            <span>Watch preview</span>
          </a>
        </div>
      </div>

      <!-- Bottom Chapters Row -->
      <section class="chapters-section">
        <div class="chapters-header">
          <h2 class="chapters-title" id="animChaptersTitle">CHAPTERS</h2>
          <a href="#all-chapters" class="chapters-link" id="animChaptersLink">
            <span>browse all chapters</span>
            <span class="chevron">›</span>
          </a>
        </div>

        <div class="chapters-scroll-track">
          <!-- Card 1: Vegetable Garden -->
          <article class="chapter-card chapter-card-1" id="animCard1">
            <div class="card-media-wrapper">
              <img
                class="card-art"
                src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/cd2d844f-ae3f-4fa9-8067-b077530b6e71.webp"
                alt="A vegetable garden with tomato stakes and a cottage"
                loading="lazy"
              />
              <div class="card-play-btn" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M7 5.5C7 4.7 7.9 4.2 8.6 4.65L18.4 11.15C19.05 11.55 19.05 12.45 18.4 12.85L8.6 19.35C7.9 19.8 7 19.3 7 18.5V5.5Z"/>
                </svg>
              </div>
            </div>
          </article>

          <!-- Card 2: Hill path & sheep -->
          <article class="chapter-card chapter-card-2" id="animCard2">
            <div class="card-media-wrapper">
              <img
                class="card-art"
                src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/48f5b97e-c27c-4afd-9427-eb35aebd1751.webp"
                alt="A boy and dog on a hill path among sheep above the sea"
                loading="lazy"
              />
              <div class="card-play-btn" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M7 5.5C7 4.7 7.9 4.2 8.6 4.65L18.4 11.15C19.05 11.55 19.05 12.45 18.4 12.85L8.6 19.35C7.9 19.8 7 19.3 7 18.5V5.5Z"/>
                </svg>
              </div>
            </div>
          </article>

          <!-- Card 3: Kite on breezy hill -->
          <article class="chapter-card chapter-card-3" id="animCard3">
            <div class="card-media-wrapper">
              <img
                class="card-art"
                src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/cde5384e-ce4d-423f-925a-451b779066e0.webp"
                alt="A girl in a straw hat flying a kite on a breezy hill"
                loading="lazy"
              />
              <div class="card-play-btn" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M7 5.5C7 4.7 7.9 4.2 8.6 4.65L18.4 11.15C19.05 11.55 19.05 12.45 18.4 12.85L8.6 19.35C7.9 19.8 7 19.3 7 18.5V5.5Z"/>
                </svg>
              </div>
            </div>
          </article>
        </div>
      </section>
    </div>
  </main>

  <script>
    // Web Animations API entrance sequence
    document.addEventListener("DOMContentLoaded", () => {
      // Check reduced motion preference
      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (prefersReducedMotion) return;

      const logo = document.getElementById("animLogo");
      const navPill = document.getElementById("animNavPill");
      const navJoin = document.getElementById("animNavJoin");
      const kicker = document.getElementById("animKicker");
      const headline1 = document.getElementById("animHeadline1");
      const headline2 = document.getElementById("animHeadline2");
      const subline = document.getElementById("animSubline");
      const btnJoin = document.getElementById("animBtnJoin");
      const btnPreview = document.getElementById("animBtnPreview");
      const chaptersTitle = document.getElementById("animChaptersTitle");
      const chaptersLink = document.getElementById("animChaptersLink");
      const card1 = document.getElementById("animCard1");
      const card2 = document.getElementById("animCard2");
      const card3 = document.getElementById("animCard3");

      // 1. Logo, nav pill, and join drop in
      const dropInKeyframes = [
        { opacity: 0, transform: "translateY(-24px)" },
        { opacity: 1, transform: "translateY(0)" }
      ];
      const navTiming = { duration: 650, easing: "cubic-bezier(0.16, 1, 0.3, 1)", fill: "backwards" };

      if (logo) logo.animate(dropInKeyframes, { ...navTiming, delay: 100 });
      if (navPill) navPill.animate(dropInKeyframes, { ...navTiming, delay: 180 });
      if (navJoin) navJoin.animate(dropInKeyframes, { ...navTiming, delay: 240 });

      // 2. Kicker un-blurs
      if (kicker) {
        kicker.animate([
          { opacity: 0, filter: "blur(14px)", transform: window.innerWidth <= 820 ? "translateY(12px)" : "translateX(-50%) translateY(12px)" },
          { opacity: 1, filter: "blur(0px)", transform: window.innerWidth <= 820 ? "translateY(0)" : "translateX(-50%) translateY(0)" }
        ], {
          duration: 750,
          delay: 350,
          easing: "cubic-bezier(0.16, 1, 0.3, 1)",
          fill: "backwards"
        });
      }

      // 3. Each headline line springs up out of blur, 0.16s apart
      const headlineTiming = { duration: 850, easing: "cubic-bezier(0.34, 1.56, 0.64, 1)", fill: "backwards" };
      if (headline1) {
        headline1.animate([
          { opacity: 0, filter: "blur(16px)", transform: "translateY(45px) scale(0.96)" },
          { opacity: 1, filter: "blur(0px)", transform: "translateY(0) scale(1)" }
        ], { ...headlineTiming, delay: 480 });
      }
      if (headline2) {
        headline2.animate([
          { opacity: 0, filter: "blur(16px)", transform: "translateY(45px) scale(0.96)" },
          { opacity: 1, filter: "blur(0px)", transform: "translateY(0) scale(1)" }
        ], { ...headlineTiming, delay: 640 }); // +0.16s
      }

      // 4. Subline, buttons, chapters title & link, cards rise in turn
      const riseKeyframes = (isCentered) => [
        { opacity: 0, transform: isCentered ? "translateX(-50%) translateY(26px)" : "translateY(26px)" },
        { opacity: 1, transform: isCentered ? "translateX(-50%) translateY(0)" : "translateY(0)" }
      ];

      const flowRiseKeyframes = [
        { opacity: 0, transform: "translateY(26px)" },
        { opacity: 1, transform: "translateY(0)" }
      ];

      const riseTiming = { duration: 700, easing: "cubic-bezier(0.16, 1, 0.3, 1)", fill: "backwards" };
      const isDesktop = window.innerWidth > 820;

      if (subline) {
        subline.animate(isDesktop ? riseKeyframes(true) : flowRiseKeyframes, { ...riseTiming, delay: 820 });
      }
      if (btnJoin) {
        btnJoin.animate(flowRiseKeyframes, { ...riseTiming, delay: 940 });
      }
      if (btnPreview) {
        btnPreview.animate(flowRiseKeyframes, { ...riseTiming, delay: 1020 });
      }
      if (chaptersTitle) {
        chaptersTitle.animate(flowRiseKeyframes, { ...riseTiming, delay: 1140 });
      }
      if (chaptersLink) {
        chaptersLink.animate(flowRiseKeyframes, { ...riseTiming, delay: 1180 });
      }
      if (card1) {
        card1.animate(flowRiseKeyframes, { ...riseTiming, delay: 1260 });
      }
      if (card2) {
        card2.animate(flowRiseKeyframes, { ...riseTiming, delay: 1380 });
      }
      if (card3) {
        card3.animate(flowRiseKeyframes, { ...riseTiming, delay: 1500 });
      }
    });
  </script>
</body>
</html>
